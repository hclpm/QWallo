[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwallo"
version = "0.1.0"
description = "Allosteric site prediction by quantum walk propagation on residue networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "biopython>=1.81"]

[project.urls]
Repository = "https://github.com/hclpm/QWallo"

[tool.setuptools]
packages = ["qwallo", "config"]
